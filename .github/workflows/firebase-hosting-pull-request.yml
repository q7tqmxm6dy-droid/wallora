# Creates a temporary preview channel for each pull request.
name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The web app's catalogue and images are generated from the Android sources (they are git-ignored), so build
      # them here. Without this step the site deploys without any wallpapers.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the web app catalogue and images
        run: |
          pip install pillow
          python3 scripts/export_web_catalog.py
          node firebase/webadmin/app/tests.mjs
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WALLORA_BC950 }}
          projectId: wallora-bc950
