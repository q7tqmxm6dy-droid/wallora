name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Surfaced as env so steps can test whether the signing key is available.
    # A release build without it would be unsigned, so those steps are skipped rather than
    # producing an artifact that Play would reject.
    env:
      KEYSTORE_B64: ${{ secrets.WALLORA_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package set still asks for `tools`, which Google removed from
          # the SDK repository: sdkmanager then exits 1 and the job fails before compiling
          # anything. Requesting only platform-tools avoids the dead package.
          packages: 'platform-tools'

      - name: Install platform / build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" > /dev/null 2>&1 || true

      # google-services.json is git-ignored (it holds your project's API key).
      # Store it once with:
      #   base64 -w0 app/google-services.json | gh secret set GOOGLE_SERVICES_JSON
      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      # Store the upload key once with:
      #   base64 -w0 keys/wallora-upload.jks | gh secret set WALLORA_KEYSTORE_BASE64
      #   gh secret set WALLORA_KEYSTORE_PASSWORD   (then WALLORA_KEY_ALIAS, WALLORA_KEY_PASSWORD)
      - name: Restore upload keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          mkdir -p keys
          echo "$KEYSTORE_B64" | base64 -d > keys/wallora-upload.jks
          {
            echo "storeFile=keys/wallora-upload.jks"
            echo "storePassword=${{ secrets.WALLORA_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.WALLORA_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.WALLORA_KEY_PASSWORD }}"
          } > keystore.properties

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wallora-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build signed release
        if: env.KEYSTORE_B64 != ''
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Upload release AAB
        if: env.KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: wallora-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Attach AAB to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_B64 != ''
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/bundle/release/app-release.aab
